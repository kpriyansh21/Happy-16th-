<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink-bg:    #fde8ec;
      --pink-mid:   #f9cdd6;
      --pink-deep:  #e8a0b0;
      --pink-accent:#d6607a;
      --cream:      #fff7f8;
      --text-dark:  #3a1f28;
      --text-mid:   #7a4858;
      --card-w:     340px;
      --card-h:     440px;
      --radius:     22px;
      --transition: 0.55s cubic-bezier(0.77, 0, 0.18, 1);
    }

    body {
      min-height: 100vh;
      background: var(--pink-bg);
      background-image:
        radial-gradient(ellipse 60% 50% at 20% 20%, #fbd0da88 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 80%, #f7b8ca66 0%, transparent 60%);
      font-family: 'Lato', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.8s ease both;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--text-dark);
      letter-spacing: 0.03em;
    }
    header h1 em {
      color: var(--pink-accent);
      font-style: italic;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--text-mid);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ── Stage ── */
    .stage {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1200px;
    }

    /* ── Cards ── */
    .card {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow:
        0 12px 40px #d6607a22,
        0 4px 12px #d6607a11;
      transition:
        transform var(--transition),
        opacity var(--transition),
        z-index 0s;
      cursor: pointer;
      background: var(--cream);
    }
    .card img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 18px 22px 0;
    }
    .card-tag {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink-accent);
      font-weight: 400;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--text-dark);
      margin-top: 4px;
      line-height: 1.3;
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--text-mid);
      margin-top: 4px;
      font-weight: 300;
    }

    /* States */
    .card[data-state="active"] {
      transform: translateX(0) scale(1) rotateY(0deg);
      opacity: 1;
      z-index: 10;
    }
    .card[data-state="prev"] {
      transform: translateX(-110%) scale(0.88) rotateY(12deg);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }
    .card[data-state="next"] {
      transform: translateX(110%) scale(0.88) rotateY(-12deg);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }
    .card[data-state="hidden"] {
      transform: translateX(0) scale(0.8);
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Peek cards */
    .card[data-state="peek-left"] {
      transform: translateX(-72%) scale(0.82) rotateY(8deg);
      opacity: 0.45;
      z-index: 5;
      pointer-events: none;
    }
    .card[data-state="peek-right"] {
      transform: translateX(72%) scale(0.82) rotateY(-8deg);
      opacity: 0.45;
      z-index: 5;
      pointer-events: none;
    }

    /* ── Dots ── */
    .dots {
      display: flex;
      gap: 10px;
      margin-top: 36px;
      align-items: center;
      animation: fadeUp 0.8s 0.3s ease both;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--pink-deep);
      opacity: 0.4;
      transition: all 0.35s ease;
      cursor: pointer;
      border: none;
    }
    .dot.active {
      opacity: 1;
      background: var(--pink-accent);
      width: 26px;
      border-radius: 4px;
    }

    /* ── Nav buttons ── */
    .nav-row {
      display: flex;
      gap: 16px;
      margin-top: 22px;
      animation: fadeUp 0.8s 0.45s ease both;
    }
    .nav-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--pink-deep);
      background: var(--cream);
      color: var(--pink-accent);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px #d6607a18;
    }
    .nav-btn:hover {
      background: var(--pink-accent);
      color: white;
      border-color: var(--pink-accent);
      transform: scale(1.08);
      box-shadow: 0 6px 20px #d6607a44;
    }
    .nav-btn:active { transform: scale(0.95); }

    /* Counter */
    .counter {
      margin-top: 14px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-mid);
      text-transform: uppercase;
      font-weight: 300;
      animation: fadeUp 0.8s 0.55s ease both;
    }
    .counter span { color: var(--pink-accent); font-weight: 400; }

    /* Keyframes */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>A Little <em>Gallery</em></h1>
    <p>Swipe through the collection</p>
  </header>

  <div class="stage" id="stage">

    <div class="card" data-index="0">
      <img src="https://images.unsplash.com/photo-1490750967868-88df5691cc9e?w=680&q=80" alt="Flowers"/>
      <div class="card-body">
        <div class="card-tag">Nature</div>
        <div class="card-title">Spring Blooms</div>
        <div class="card-sub">A soft breath of the season</div>
      </div>
    </div>

    <div class="card" data-index="1">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=680&q=80" alt="Mountains"/>
      <div class="card-body">
        <div class="card-tag">Landscape</div>
        <div class="card-title">Golden Heights</div>
        <div class="card-sub">Where the sky meets silence</div>
      </div>
    </div>

    <div class="card" data-index="2">
      <img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=680&q=80" alt="Forest"/>
      <div class="card-body">
        <div class="card-tag">Forest</div>
        <div class="card-title">Still & Green</div>
        <div class="card-sub">Light threading through the trees</div>
      </div>
    </div>

    <div class="card" data-index="3">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=680&q=80" alt="Ocean"/>
      <div class="card-body">
        <div class="card-tag">Ocean</div>
        <div class="card-title">Endless Shore</div>
        <div class="card-sub">Salt, sky, and open horizons</div>
      </div>
    </div>

  </div>

  <!-- Dots -->
  <div class="dots" id="dots">
    <button class="dot" data-i="0"></button>
    <button class="dot" data-i="1"></button>
    <button class="dot" data-i="2"></button>
    <button class="dot" data-i="3"></button>
  </div>

  <!-- Arrow nav -->
  <div class="nav-row">
    <button class="nav-btn" id="prev">&#8592;</button>
    <button class="nav-btn" id="next">&#8594;</button>
  </div>

  <div class="counter">Card <span id="curr">1</span> of <span>4</span></div>

  <script>
    const cards = [...document.querySelectorAll('.card')];
    const dots  = [...document.querySelectorAll('.dot')];
    const total = cards.length;
    let current = 0;

    function getState(i) {
      const diff = (i - current + total) % total;
      if (diff === 0)               return 'active';
      if (diff === 1)               return 'peek-right';
      if (diff === total - 1)       return 'peek-left';
      return 'hidden';
    }

    function render() {
      cards.forEach((c, i) => c.setAttribute('data-state', getState(i)));
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      document.getElementById('curr').textContent = current + 1;
    }

    function go(dir) {
      current = (current + dir + total) % total;
      render();
    }

    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);

    dots.forEach(d => d.addEventListener('click', () => {
      current = +d.dataset.i; render();
    }));

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    // Touch / swipe
    let tx = 0;
    document.getElementById('stage').addEventListener('touchstart', e => tx = e.touches[0].clientX);
    document.getElementById('stage').addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    });

    render();
  </script>
</body>
</html>
